name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    # Node.js 22.18 is the oldest version tokenomics supports (type stripping on by default,
    # node:sqlite built in). The tests use node:test, so nothing has to be installed.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.18.0" }
          - { os: ubuntu-latest, node: "24" }
          - { os: macos-latest, node: "24" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests (Node built-ins only, nothing to install)
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Type-check with TypeScript
        run: npm run typecheck
