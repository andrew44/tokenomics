name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    # ubuntu-22.04 still offers Python 3.8, the oldest version tokenomics supports.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests (stdlib only, nothing to install)
        working-directory: tests
        run: python -m unittest -v
