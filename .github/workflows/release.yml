name: release

# Every update to main becomes a GitHub release (vX.Y.Z), once the tests pass.
#
# Version: a patch bump from the last release, written into both plugin manifests and committed
# through a pull request to main, because Claude Code only sends plugin users an update when the version changes. For a
# minor or major release, raise "version" in .claude-plugin/plugin.json and plugin.json yourself;
# that version is released as it is. Logic: .github/scripts/next_version.ts.

on:
  push:
    branches: [main]
  # Commits pushed by other workflows (the weekly price update) don't trigger `push`.
  workflow_run:
    workflows: ["Update model prices"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release                # one at a time, in order; never cancel a release half-way
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit tests
        run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0          # all tags and history, to find the last release
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Work out the version
        id: v
        run: node .github/scripts/next_version.ts | tee -a "$GITHUB_OUTPUT"

      - name: Nothing new since the last release
        if: steps.v.outputs.release != 'true'
        run: echo "main has no changes since ${{ steps.v.outputs.previous }}; no release."

      # main is protected, so the bump goes in through a pull request. Once it merges, the push to
      # main runs this workflow again; the manifests are then ahead of the last tag, so that run
      # releases the version as it is (bump=false) and publishes.
      - name: Open a pull request with the version bump
        if: steps.v.outputs.release == 'true' && steps.v.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/${{ steps.v.outputs.tag }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; its pull request is pending."; exit 0
          fi
          node .github/scripts/next_version.ts --write "${{ steps.v.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Release ${{ steps.v.outputs.tag }}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Release ${{ steps.v.outputs.tag }}" \
            --body "Version bump for ${{ steps.v.outputs.tag }}. Merging this publishes the release."
          gh pr merge "$branch" --auto --squash || echo "Auto-merge isn't enabled; merge the pull request to release."

      - name: Publish the release
        if: steps.v.outputs.release == 'true' && steps.v.outputs.bump != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="${{ steps.v.outputs.previous }}"
          gh release create "${{ steps.v.outputs.tag }}" \
            --target "$(git rev-parse HEAD)" \
            --title "tokenomics ${{ steps.v.outputs.tag }}" \
            --generate-notes ${prev:+--notes-start-tag "$prev"} \
            install.sh install.ps1
          {
            echo "### Released ${{ steps.v.outputs.tag }}"
            echo "Claude Code users get it from \`/plugin\` (or automatically, with auto-update on)."
          } >> "$GITHUB_STEP_SUMMARY"
